name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # The specifications are validated before the build, so that a specification that does
      # not validate fails the run in seconds instead of after the whole build. The version of
      # the validation tool is the one mise.toml pins, and a test keeps the two pins equal.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate the specifications
        run: npx --yes @fission-ai/openspec@1.14.3 validate --all --strict

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The same gate a local release uses. Only `verify` reaches the failsafe
      # JarSmokeIT against the packaged uber-jar and the SBOM checks over
      # target/bom.json; a compile-only or unit-test-only step would not.
      - name: Verify the build
        run: mvn -B verify
